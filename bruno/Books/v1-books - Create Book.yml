info:
  name: /v1/books - Create Book
  type: http
  seq: 2

http:
  method: POST
  url: "{{http_url}}/v1/books"
  body:
    type: json
    data: |-
      {
        "title": "{{$randomJobTitle}}",
        "isbn": "{{randomIsbn}}",
        "description": "{{$randomLoremParagraphs}}",
        "published_date": "{{$randomDatePast}}",
        "page_count": "{{$randomInt}}",
        "language": "{{$randomCountryCode}}",
        "genre": "{{$randomCity}}",
        "price": "{{$randomInt}}",
        "author_id": {{randomAuthorId}}
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const randomAuthorId = Math.floor(Math.random() * 50) + 1;
        bru.setVar("randomAuthorId", randomAuthorId);

        function generateISBN13() {
            const prefix = "978";
            let digits = prefix;
            
            // Generer 9 tilfældige cifre
            for (let i = 0; i < 9; i++) {
                digits += Math.floor(Math.random() * 10);
            }
            
            // Beregn check digit
            let sum = 0;
            for (let i = 0; i < 12; i++) {
                sum += parseInt(digits[i]) * (i % 2 === 0 ? 1 : 3);
            }
            const checkDigit = (10 - (sum % 10)) % 10;
            
            return digits + checkDigit;
        }

        bru.setVar("randomIsbn", generateISBN13());

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
