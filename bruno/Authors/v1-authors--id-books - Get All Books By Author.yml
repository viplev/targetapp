info:
  name: v1/authors/:id/books - Get All Books By Author
  type: http
  seq: 3

http:
  method: GET
  url: "{{http_url}}/v1/authors/:id/books"
  params:
    - name: id
      value: "{{randomAuthorId}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const randomAuthorId = Math.floor(Math.random() * 50) + 1;
        bru.setVar("randomAuthorId", randomAuthorId);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
