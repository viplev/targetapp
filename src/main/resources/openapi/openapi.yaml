openapi: 3.1.0
info:
  title: VIPLEV Target
  description: This is an API specification
  version: 1.0.0


tags:
  - name: Authors
    description: Operations related to authors
  - name: Books
    description: Operations related to books


paths:
  /v1/authors:
    get:
      summary: List authors
      operationId: listAuthors
      tags:
        - Authors
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Authors retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorsDTO'
        '500':
          $ref: '#/components/responses/500InternalServerError'
    post:
      summary: Create author
      operationId: createAuthor
      tags:
        - Authors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorDTO'
      responses:
        '201':
          description: Author created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorDTO'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '409':
          $ref: '#/components/responses/409Conflict'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /v1/authors/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Author identifier
        schema:
          type: integer
          format: int64
    get:
      summary: Get author by id
      operationId: getAuthorById
      tags:
        - Authors
      responses:
        '200':
          description: Author retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorDTO'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
    patch:
      summary: Update author
      operationId: updateAuthor
      tags:
        - Authors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorDTO'
      responses:
        '200':
          description: Author updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorDTO'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
    delete:
      summary: Delete author
      operationId: deleteAuthor
      tags:
        - Authors
      responses:
        '204':
          description: Author deleted successfully
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /v1/authors/{id}/books:
    parameters:
      - name: id
        in: path
        required: true
        description: Author identifier
        schema:
          type: integer
          format: int64
    get:
      summary: List books by author
      operationId: listBooksByAuthor
      tags:
        - Authors
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Books retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BooksDTO'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /v1/books:
    get:
      summary: List books
      operationId: listBooks
      tags:
        - Books
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
      responses:
        '200':
          description: Books retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BooksDTO'
        '500':
          $ref: '#/components/responses/500InternalServerError'
    post:
      summary: Create book
      operationId: createBook
      tags:
        - Books
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookDTO'
      responses:
        '201':
          description: Book created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDTO'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '409':
          $ref: '#/components/responses/409Conflict'
        '500':
          $ref: '#/components/responses/500InternalServerError'

  /v1/books/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Book identifier
        schema:
          type: integer
          format: int64
    get:
      summary: Get book by id
      operationId: getBookById
      tags:
        - Books
      responses:
        '200':
          description: Book retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDTO'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
    patch:
      summary: Update book
      operationId: updateBook
      tags:
        - Books
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookDTO'
      responses:
        '200':
          description: Book updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDTO'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'
    delete:
      summary: Delete book
      operationId: deleteBook
      tags:
        - Books
      responses:
        '204':
          description: Book deleted successfully
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalServerError'


components:
  parameters:
    PageParam:
      name: page
      in: query
      required: false
      description: Zero-based page index
      schema:
        type: integer
        format: int32
        default: 0
        minimum: 0
    SizeParam:
      name: size
      in: query
      required: false
      description: Number of items per page
      schema:
        type: integer
        format: int32
        default: 10
        minimum: 1

  responses:
    400BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDTO'
          examples:
            invalidField:
              summary: Invalid field
              value:
                type: /errors/bad-request
                title: Bad Request
                status: 400
                detail: The field 'name' is required
                instance: /v1/environments
            invalidFormat:
              summary: Invalid format
              value:
                type: /errors/bad-request
                title: Bad Request
                status: 400
                detail: The field 'port' must be a number
                instance: /v1/environments
    404NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDTO'
          examples:
            notFound:
              summary: Resource not found
              value:
                type: /errors/not-found
                title: Not Found
                status: 404
                detail: Resource with id '123' not found
                instance: /v1/environments/123
    409Conflict:
      description: Resource state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDTO'
          examples:
            conflict:
              summary: Resource state conflict
              value:
                type: https://developer.mozilla.org/en-US/docs/Web/HTTP/Status/409
                title: Conflict - Resource state conflict
                status: 409
                detail: The requested action conflicts with the current state of the resource
                instance: /v1/environments/123
    500InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDTO'
          examples:
            serverError:
              summary: Server error
              value:
                type: /errors/internal-server-error
                title: Internal Server Error
                status: 500
                detail: An unexpected error occurred while processing the request
                instance: /v1/environments

  schemas:

    ErrorDTO:
      type: object
      properties:
        type:
          type: string
          format: uri
          description: URI reference identifying the problem type
          examples:
            - /errors/bad-request
        title:
          type: string
          description: A short, human-readable description of the problem type
          examples:
            - Bad Request
        status:
          type: integer
          description: HTTP status code
          examples:
            - 400
        detail:
          type: string
          description: A detailed explanation of the problem
          examples:
            - The field 'name' is required
        instance:
          type: string
          format: uri
          description: URI reference identifying the specific occurrence of the problem
          examples:
            - /v1/environments/123

    AuthorsDTO:
      type: object
      properties:
        authors:
          type: array
          items:
            $ref: '#/components/schemas/AuthorDTO'
        self:
          type: string
          format: uri
          description: Link to the current page
          examples:
            - "/v1/authors?page=2&size=10"
        first:
          type: string
          format: uri
          description: Link to the first page
          examples:
            - "/v1/authors?page=0&size=10"
        prev:
          type: string
          format: uri
          description: Link to the previous page. Absent on the first page.
          examples:
            - "/v1/authors?page=1&size=10"
        next:
          type: string
          format: uri
          description: Link to the next page. Absent on the last page.
          examples:
            - "/v1/authors?page=3&size=10"
        last:
          type: string
          format: uri
          description: Link to the last page
          examples:
            - "/v1/authors?page=4&size=10"
        total_elements:
          type: integer
          format: int64
          description: Total number of elements across all pages
          examples:
            - 42
        total_pages:
          type: integer
          format: int32
          description: Total number of pages
          examples:
            - 5

    BooksDTO:
      type: object
      properties:
        books:
          type: array
          items:
            $ref: '#/components/schemas/BookDTO'
        self:
          type: string
          format: uri
          description: Link to the current page
          examples:
            - "/v1/books?page=2&size=10"
        first:
          type: string
          format: uri
          description: Link to the first page
          examples:
            - "/v1/books?page=0&size=10"
        prev:
          type: string
          format: uri
          description: Link to the previous page. Absent on the first page.
          examples:
            - "/v1/books?page=1&size=10"
        next:
          type: string
          format: uri
          description: Link to the next page. Absent on the last page.
          examples:
            - "/v1/books?page=3&size=10"
        last:
          type: string
          format: uri
          description: Link to the last page
          examples:
            - "/v1/books?page=4&size=10"
        total_elements:
          type: integer
          format: int64
          description: Total number of elements across all pages
          examples:
            - 42
        total_pages:
          type: integer
          format: int32
          description: Total number of pages
          examples:
            - 5

    AuthorDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          examples:
            - 1
        name:
          type: string
          examples:
            - "George Orwell"

    BookDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
          examples:
            - 1
        title:
          type: string
          examples:
            - "1984"
        isbn:
          type: string
          examples:
            - "9780451524935"
        description:
          type: string
          examples:
            - "A dystopian novel set in a totalitarian society under constant surveillance."
        published_date:
          type: string
          format: date
          examples:
            - "1949-06-08"
        page_count:
          type: integer
          format: int32
          examples:
            - 328
        language:
          type: string
          examples:
            - "en"
        genre:
          type: string
          examples:
            - "Dystopian"
        price:
          type: number
          examples:
            - 149.95
        author_id:
          type: integer
          format: int64
          examples:
            - 1
